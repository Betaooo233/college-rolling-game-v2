<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFF7E8">
  <title>大学生人格进化论</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="game-shell" aria-label="大学生人格进化论游戏区域">
    <section id="game-container">
      <canvas id="fx-canvas" width="414" height="828" aria-hidden="true"></canvas>
      <div id="scene-root"></div>
      <div id="overlay-root" aria-live="polite"></div>
      <div id="loading-screen" class="loading-screen">
        <div class="loading-card">
          <div class="loading-title">大学生人格进化论</div>
          <div class="loading-subtitle">正在翻找校园手账...</div>
          <div class="loading-track"><div id="loading-bar" class="loading-bar"></div></div>
          <div id="loading-text" class="loading-text">0%</div>
        </div>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="game.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      Game.prepareLayout();
      Loader.loadAll(function() {
        Game.init();
        Game.showStartScreen();
      });
    });
  </script>
</body>
</html>
